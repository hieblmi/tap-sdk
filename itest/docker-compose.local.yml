# Build tapd from TAPD_REF (main by default) to test unreleased behavior.
#
# Usage:
#   docker compose \
#     -f itest/docker-compose.yml \
#     -f itest/docker-compose.local.yml \
#     up -d --build
#
#   go test -tags=itest -timeout=20m ./itest/...
#
# CI pins TAPD_REF to the commit providing publication recovery.

services:
  tapd-alice:
    image: tap-sdk/tapd:local
    build:
      context: https://github.com/lightninglabs/taproot-assets.git#${TAPD_REF:-main}
      args:
        checkout: ${TAPD_REF:-main}

  tapd-bob:
    image: tap-sdk/tapd:local
    build:
      context: https://github.com/lightninglabs/taproot-assets.git#${TAPD_REF:-main}
      args:
        checkout: ${TAPD_REF:-main}
